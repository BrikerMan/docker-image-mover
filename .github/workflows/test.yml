name: Test

on:
  push:
  pull_request:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/transform-image.sh scripts/test-transform.sh

      - name: Dry-run over config/target-images.txt
        run: |
          chmod +x scripts/transform-image.sh scripts/test-transform.sh
          ./scripts/test-transform.sh
